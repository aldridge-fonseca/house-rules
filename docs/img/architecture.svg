<svg xmlns="http://www.w3.org/2000/svg" width="960" height="430" font-family="Arial, sans-serif" viewBox="0 0 960 430">
  <rect width="960" height="430" fill="white"/>
  <text x="20" y="26" font-size="18" font-weight="bold" fill="#1A1A1A">House Rules</text>
  <text x="128" y="26" font-size="13" fill="#666">— deterministic policy pipeline; every model call runs on Fireworks AI</text>
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 z" fill="#555"/>
    </marker>
  </defs>

  <!-- Input -->
  <rect x="20" y="170" width="120" height="60" rx="8" fill="#f4f4f4" stroke="#999"/>
  <text x="80" y="195" font-size="14" text-anchor="middle">Message</text>
  <text x="80" y="215" font-size="12" text-anchor="middle" fill="#666">text + optional image</text>

  <!-- Normalize -->
  <rect x="185" y="160" width="140" height="80" rx="8" fill="#eaf3dd" stroke="#76B900"/>
  <text x="255" y="185" font-size="14" text-anchor="middle" font-weight="bold">Normalize</text>
  <text x="255" y="205" font-size="11" text-anchor="middle" fill="#444">NFKC, zero-width strip,</text>
  <text x="255" y="220" font-size="11" text-anchor="middle" fill="#444">leetspeak/base64 unfold</text>

  <!-- Rule gate -->
  <rect x="370" y="160" width="120" height="80" rx="8" fill="#eaf3dd" stroke="#76B900"/>
  <text x="430" y="190" font-size="14" text-anchor="middle" font-weight="bold">Rule gate</text>
  <text x="430" y="210" font-size="11" text-anchor="middle" fill="#444">PII / jailbreak / policy</text>

  <!-- Router -->
  <rect x="535" y="160" width="110" height="80" rx="8" fill="#eaf3dd" stroke="#76B900"/>
  <text x="590" y="195" font-size="14" text-anchor="middle" font-weight="bold">Router</text>
  <text x="590" y="215" font-size="11" text-anchor="middle" fill="#444">deterministic</text>

  <!-- Lanes -->
  <rect x="690" y="30" width="250" height="70" rx="8" fill="#eaf3dd" stroke="#76B900"/>
  <text x="815" y="55" font-size="13" text-anchor="middle" font-weight="bold">Vision lane</text>
  <text x="815" y="75" font-size="11" text-anchor="middle" fill="#444">Nemotron 3.5 Super VL 120B</text>
  <text x="815" y="90" font-size="11" text-anchor="middle" fill="#444">(wired on Fireworks on-demand — not evaluated)</text>

  <rect x="690" y="125" width="250" height="70" rx="8" fill="#d5e8b8" stroke="#76B900" stroke-width="2"/>
  <text x="815" y="150" font-size="13" text-anchor="middle" font-weight="bold">Specialist lane (default)</text>
  <text x="815" y="170" font-size="11" text-anchor="middle" fill="#444">Nemotron Nano 3 30B-A3B + LoRA</text>
  <text x="815" y="185" font-size="11" text-anchor="middle" fill="#444">Fireworks Training API · on-demand (1x B200)</text>

  <rect x="690" y="220" width="250" height="70" rx="8" fill="#eaf3dd" stroke="#76B900"/>
  <text x="815" y="245" font-size="13" text-anchor="middle" font-weight="bold">Multilingual lane</text>
  <text x="815" y="265" font-size="11" text-anchor="middle" fill="#444">same tuned specialist</text>
  <text x="815" y="280" font-size="11" text-anchor="middle" fill="#444">(non-English text)</text>

  <!-- Confidence gate -->
  <rect x="535" y="330" width="180" height="70" rx="8" fill="#fff3d6" stroke="#e0a800"/>
  <text x="625" y="355" font-size="13" text-anchor="middle" font-weight="bold">Confidence gate</text>
  <text x="625" y="375" font-size="11" text-anchor="middle" fill="#444">P(unsafe) gray zone &#8594; escalate</text>

  <!-- Escalation -->
  <rect x="760" y="330" width="180" height="70" rx="8" fill="#eaf3dd" stroke="#76B900"/>
  <text x="850" y="355" font-size="13" text-anchor="middle" font-weight="bold">Escalation</text>
  <text x="850" y="375" font-size="11" text-anchor="middle" fill="#444">Nemotron 3 Ultra 550B</text>
  <text x="850" y="390" font-size="11" text-anchor="middle" fill="#444">(Fireworks serverless)</text>

  <!-- Verdict -->
  <rect x="185" y="330" width="140" height="70" rx="8" fill="#f4f4f4" stroke="#999"/>
  <text x="255" y="358" font-size="14" text-anchor="middle" font-weight="bold">Verdict</text>
  <text x="255" y="378" font-size="11" text-anchor="middle" fill="#666">label, categories, route,</text>
  <text x="255" y="392" font-size="11" text-anchor="middle" fill="#666">latency, cost</text>

  <!-- Arrows -->
  <line x1="140" y1="200" x2="182" y2="200" stroke="#555" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="325" y1="200" x2="367" y2="200" stroke="#555" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="490" y1="200" x2="532" y2="200" stroke="#555" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="645" y1="180" x2="687" y2="65" stroke="#555" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="645" y1="200" x2="687" y2="160" stroke="#555" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="645" y1="220" x2="687" y2="255" stroke="#555" stroke-width="2" marker-end="url(#arr)"/>
  <path d="M815 195 L815 290 Q815 320 780 335 L718 352" stroke="#555" stroke-width="2" fill="none" marker-end="url(#arr)"/>
  <path d="M700 65 Q660 65 660 110 L652 330 Q650 345 640 348" stroke="#bbb" stroke-width="1.5" fill="none" stroke-dasharray="4,3"/>
  <line x1="535" y1="365" x2="328" y2="365" stroke="#555" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="715" y1="365" x2="757" y2="365" stroke="#555" stroke-width="2" marker-end="url(#arr)"/>
  <path d="M760 400 Q600 425 330 402 L268 400" stroke="#e0a800" stroke-width="1.5" fill="none" stroke-dasharray="4,3" marker-end="url(#arr)"/>

  <!-- Footer -->
  <text x="480" y="422" font-size="11" text-anchor="middle" fill="#888">Green = open NVIDIA models on Fireworks AI · Built on Fireworks AI + NVIDIA Nemotron. Clear-confidence lanes return directly; only gray-zone rows pay for escalation.</text>
</svg>
